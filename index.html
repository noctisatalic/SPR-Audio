<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPR Audio | Professional Sound Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --accent: #ffb400; /* Warna identitas utama */
            --text-main: #ffffff;
            --text-dim: #a3a3a3;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero {
            padding: 80px 20px;
            text-align: center;
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        h1 { font-size: 3rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 10px; text-transform: uppercase; }
        .hero p { color: var(--text-dim); max-width: 600px; margin: 0 auto 30px; }

        /* Calculator Styles */
        .calc-container {
            max-width: 500px;
            margin: -50px auto 50px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        select, button {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1f1f1f;
            color: white;
            font-family: inherit;
        }

        button {
            background: var(--accent);
            color: black;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #e6a200; transform: translateY(-2px); }

        /* Contact Section */
        .cta-box {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid #333;
        }

        .dm-btn {
            display: inline-block;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .dm-btn:hover {
            background: var(--accent);
            color: black;
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>SPR AUDIO</h1>
        <p>Solusi teknis audio profesional untuk event, produksi, dan kebutuhan sound system Anda. Kualitas tanpa kompromi.</p>
    </header>

    <div class="calc-container">
        <h3 style="text-align: center; margin-bottom: 20px;">Estimasi Biaya</h3>
        <select id="service-select">
            <option value="500000">Sewa Sound System Basic - Rp 500k</option>
            <option value="1200000">Sewa Sound System Full Set - Rp 1.2jt</option>
            <option value="2000000">Recording & Mixing - Rp 2jt</option>
        </select>
        <button onclick="calculate()">Hitung Estimasi</button>
        <div id="result" style="text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--accent);"></div>
    </div>

    <section class="cta-box">
        <h3>Butuh Ketersediaan Tanggal?</h3>
        <p style="color: var(--text-dim);">Silahkan diskusikan ketersediaan jadwal Anda langsung dengan kami.</p>
        <br>
        <a href="https://wa.me/628123456789" class="dm-btn">Chat via WhatsApp</a>
    </section>

    <script>
        function calculate() {
            const price = document.getElementById('service-select').value;
            document.getElementById('result').innerText = "Estimasi: Rp " + parseInt(price).toLocaleString('id-ID');
        }
    </script>
</body>
</html>
